[package]
name = "rust_rest_client"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_rest_client"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
tokio = { version = "1.50.0", features = ["full"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", features = ["json","rustls","query"], default-features = false }
dashmap = "6.1.0"
once_cell = "1.21.3"
num_cpus = "1.17.0"
threadpool = "1.8.1"
indexmap = "2.13.0"
chrono  = "0.4.44"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
